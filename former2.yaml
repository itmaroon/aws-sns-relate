                IgnorePublicAcls: true
                RestrictPublicBuckets: true

    DynamoDBTable:
        Type: "AWS::DynamoDB::Table"
        Properties:
            AttributeDefinitions: 
              - 
                AttributeName: "job_id"
                AttributeType: "S"
              - 
                AttributeName: "site_url"
                AttributeType: "S"
              - 
                AttributeName: "updated_at"
                AttributeType: "N"
              - 
                AttributeName: "wp_id"
                AttributeType: "S"
            BillingMode: "PAY_PER_REQUEST"
            TableName: "convert_jobs"
            KeySchema: 
              - 
                AttributeName: "job_id"
                KeyType: "HASH"
            GlobalSecondaryIndexes: 
              - 
                IndexName: "wp_id-updated_at-index"
                KeySchema: 
                  - 
                    AttributeName: "wp_id"
                    KeyType: "HASH"
                  - 
                    AttributeName: "updated_at"
                    KeyType: "RANGE"
                Projection: 
                    ProjectionType: "ALL"
                ProvisionedThroughput: 
                    ReadCapacityUnits: 0
                    WriteCapacityUnits: 0
              - 
                IndexName: "site_url-updated_at-index"
                KeySchema: 
                  - 
                    AttributeName: "site_url"
                    KeyType: "HASH"
                  - 
                    AttributeName: "updated_at"
                    KeyType: "RANGE"
                Projection: 
                    ProjectionType: "ALL"
                ProvisionedThroughput: 
                    ReadCapacityUnits: 0
                    WriteCapacityUnits: 0

    ApiGatewayV2Api:
        Type: "AWS::ApiGatewayV2::Api"
        Properties:
            ApiKeySelectionExpression: "$request.header.x-api-key"
            ProtocolType: "HTTP"
            RouteSelectionExpression: "$request.method $request.path"
            DisableExecuteApiEndpoint: false

    StepFunctionsStateMachine:
        Type: "AWS::StepFunctions::StateMachine"
        Properties:
            StateMachineName: "IgStateMachine"
            DefinitionString: !Sub |
                {
                  "Comment": "IG video post pipeline",
                  "StartAt": "GetJob",
                  "States": {
                    "GetJob": {
                      "Type": "Task",
                      "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunction18}",
                      "ResultPath": "$.job",
                      "Next": "CreateContainer"
                    },
                    "CreateContainer": {
                      "Type": "Task",
                      "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunction16}",
                      "ResultPath": "$.container",
                      "Next": "ContainerChoice",
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "States.ALL"
                          ],
                          "IntervalSeconds": 2,
                          "MaxAttempts": 2,
                          "BackoffRate": 2
                        }
                      ]
                    },
                    "ContainerChoice": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.container.ok",
                          "BooleanEquals": true,
                          "Next": "PickCreationId"
                        }
                      ],
                      "Default": "ShowContainerError"
                    },
                    "ShowContainerError": {
                      "Type": "Pass",
                      "End": true
                    },
                    "PickCreationId": {
                      "Type": "Pass",
                      "Parameters": {
                        "creation_id.$": "$.container.body.id"
                      },
                      "ResultPath": "$.cid",
                      "Next": "WaitBeforeCheck"
                    },
                    "WaitBeforeCheck": {
                      "Type": "Wait",
                      "Seconds": 15,
                      "Next": "CheckStatus"
                    },
                    "CheckStatus": {
                      "Type": "Task",
                      "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunction9}",
                      "ResultPath": "$.status",
                      "Next": "StatusChoice",
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "States.ALL"
                          ],
                          "IntervalSeconds": 3,
                          "MaxAttempts": 3,
                          "BackoffRate": 2
                        }
                      ],
                      "Catch": [
                        {
                          "ErrorEquals": [
                            "States.ALL"
                          ],
                          "ResultPath": "$.status_error",
                          "Next": "Cleanup"
                        }
                      ]
                    },
                    "StatusChoice": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.status.code",
                          "StringEquals": "FINISHED",
                          "Next": "Publish"
                        },
                        {
                          "Variable": "$.status.code",
                          "StringEquals": "IN_PROGRESS",
                          "Next": "WaitBeforeCheck"
                        }
                      ],
                      "Default": "FailState"
                    },
                    "Publish": {
                      "Type": "Task",
                      "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunction14}",
                      "ResultPath": "$.publish",
                      "Next": "Cleanup",
                      "Retry": [
                        {
                          "ErrorEquals": [
                            "States.ALL"
                          ],
                          "IntervalSeconds": 2,
                          "MaxAttempts": 2,
                          "BackoffRate": 2
                        }
                      ],
                      "Catch": [
                        {
                          "ErrorEquals": [
                            "States.ALL"
                          ],
                          "ResultPath": "$.publish_error",
                          "Next": "Cleanup"
                        }
                      ]
                    },
                    "Cleanup": {
                      "Type": "Task",
                      "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunction4}",
                      "ResultPath": "$.cleanup",
                      "Next": "AfterCleanup"
                    },
                    "AfterCleanup": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.failure",
                          "IsPresent": true,
                          "Next": "FailState"
                        }
                      ],
                      "Default": "SuccessState"
                    },
                    "FailState": {
                      "Type": "Fail",
                      "Cause": "Creation failed or unknown status"
                    },
                    "SuccessState": {
                      "Type": "Succeed"
                    }
                  }
                }
            RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/service-role/StepFunctions-IgStateMachine-role-3evfy5jyg"
            StateMachineType: "STANDARD"
            LoggingConfiguration: 
                IncludeExecutionData: false
                Level: "OFF"

    StepFunctionsStateMachine2:
        Type: "AWS::StepFunctions::StateMachine"
        Properties:
            StateMachineName: "xStateMachine"
            DefinitionString: !Sub |
                {
                  "Comment": "Post to X workflow with per-media upload sequence",
                  "StartAt": "GetJobX",
                  "States": {
                    "GetJobX": {
                      "Type": "Task",
                      "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunction18}",
                      "Next": "CheckMedia"
                    },
                    "CheckMedia": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.media_urls",
                          "IsPresent": false,
                          "Next": "PostToX"
                        },
                        {
                          "Variable": "$.media_urls",
                          "StringEquals": "[]",
                          "Next": "PostToX"
                        }
                      ],
                      "Default": "UploadEachMedia"
                    },
                    "UploadEachMedia": {
                      "Type": "Map",
                      "ItemsPath": "$.media_urls",
                      "Parameters": {
                        "job_id.$": "$.job_id",
                        "access_token.$": "$.access_token",
                        "text.$": "$.text",
                        "caption.$": "$.caption",
                        "ig_user_id.$": "$.ig_user_id",
                        "site_url.$": "$.site_url",
                        "media_url.$": "$$.Map.Item.Value"
                      },
                      "Iterator": {
                        "StartAt": "InitializeMedia",
                        "States": {
                          "InitializeMedia": {
                            "Type": "Task",
                            "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunction15}",
                            "Next": "AppendMedia"
                          },
                          "AppendMedia": {
                            "Type": "Task",
                            "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunction13}",
                            "Next": "FinalizeMedia"
                          },
                          "FinalizeMedia": {
                            "Type": "Task",
                            "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunction3}",
                            "Next": "CheckIfProcessing"
                          },
                          "CheckIfProcessing": {
                            "Type": "Choice",
                            "Choices": [
                              {
                                "Variable": "$.status",
                                "StringEquals": "succeeded",
                                "Next": "DoneOneMedia"
                              },
                              {
                                "Variable": "$.status",
                                "StringEquals": "processing",
                                "Next": "WaitBeforePoll"
                              }
                            ],
                            "Default": "DoneOneMedia"
                          },
                          "WaitBeforePoll": {
                            "Type": "Wait",
                            "SecondsPath": "$.check_after",
                            "Next": "PollMediaStatus"
                          },
                          "PollMediaStatus": {
                            "Type": "Task",
                            "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunction8}",
                            "Next": "PollCheck"
                          },
                          "PollCheck": {
                            "Type": "Choice",
                            "Choices": [
                              {
                                "Variable": "$.status",
                                "StringEquals": "succeeded",
                                "Next": "DoneOneMedia"
                              },
                              {
                                "Variable": "$.status",
                                "StringEquals": "in_progress",
                                "Next": "WaitBeforePoll"
                              }
                            ],
                            "Default": "DoneOneMedia"
                          },
                          "DoneOneMedia": {
                            "Type": "Pass",
                            "ResultPath": "$.media_result",
                            "End": true
                          }
                        }
                      },
                      "ResultSelector": {
                        "media_ids.$": "$[*].media_id"
                      },
                      "ResultPath": "$.media_results",
                      "Next": "PreparePostToX"
                    },
                    "PreparePostToX": {
                      "Type": "Pass",
                      "Parameters": {
                        "job_id.$": "$.job_id",
                        "access_token.$": "$.access_token",
                        "text.$": "$.text",
                        "media_ids.$": "$.media_results.media_ids"
                      },
                      "Next": "PostToX"
                    },
                    "PostToX": {
                      "Type": "Task",
                      "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunction17}",
                      "Next": "Cleanup"
                    },
                    "Cleanup": {
                      "Type": "Task",
                      "Resource": "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${LambdaFunction4}",
                      "ResultPath": "$.cleanup",
                      "Next": "AfterCleanup"
                    },
                    "AfterCleanup": {
                      "Type": "Choice",
                      "Choices": [
                        {
                          "Variable": "$.failure",
                          "IsPresent": true,
                          "Next": "FailState"
                        }
                      ],
                      "Default": "SuccessState"
                    },
                    "FailState": {
                      "Type": "Fail",
                      "Cause": "Creation failed or unknown status"
                    },
                    "SuccessState": {
                      "Type": "Succeed"
                    }
                  }
                }
            RoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/service-role/StepFunctions-xStateMachine-role-ryxkhm8ed"
            StateMachineType: "STANDARD"
            LoggingConfiguration: 
                IncludeExecutionData: false
                Level: "OFF"

